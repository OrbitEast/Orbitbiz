<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening OrbitBiz Invoices</title><link rel="icon" href="/assets/orbiteastfavicon.png"><style>html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;color:#17181b}body{display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);box-sizing:border-box;background:#fff;border:1px solid #e7e8eb;border-radius:24px;padding:36px;box-shadow:0 18px 60px rgba(20,24,32,.08);text-align:center}.logo{width:52px;height:52px;display:block;margin:0 auto 18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#777;text-transform:uppercase}.card h1{font-size:28px;line-height:1.1;margin:10px 0}.card p{color:#656970;line-height:1.6;margin:0 auto 24px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px 16px;background:#17181b;color:#fff;font-weight:700;cursor:pointer}.status{font-size:13px;color:#777;margin-top:14px;min-height:20px}.back{display:inline-block;margin-top:18px;color:#555;text-decoration:none;font-size:13px}</style></head><body><main class="card"><img class="logo" src="/assets/orbiteastfavicon.png" alt="Orbit East"><div class="eyebrow">OrbitBiz · Invoicing</div><h1>Open your invoice workspace</h1><p id="message">Checking your secure OrbitBiz session…</p><button class="btn" id="continue" type="button" hidden>Continue with Google</button><div class="status" id="status"></div><a class="back" href="/features/invoicing/">← Back to invoicing</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/core/config.js"></script><script>(async()=>{const message=document.getElementById("message"),button=document.getElementById("continue"),status=document.getElementById("status");const next="/?workspace=invoices";try{const cfg=window.OrbitBiz?.config?.supabase;if(!window.supabase?.createClient||!cfg?.url||!cfg?.publishableKey)throw new Error("Supabase configuration is unavailable.");const client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session){message.textContent="Session found. Opening invoices…";location.replace(next);return}message.textContent="Sign in with Google to open your invoice workspace. Your session will be kept securely by Supabase.";button.hidden=false;button.addEventListener("click",async()=>{button.disabled=true;button.textContent="Opening Google…";status.textContent="Redirecting to secure sign-in…";const {error:authError}=await client.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+next}});if(authError){button.disabled=false;button.textContent="Continue with Google";status.textContent=authError.message||"Could not start Google sign-in."}})}catch(error){console.error(error);message.textContent="We couldn't start the invoice workspace.";button.hidden=false;button.textContent="Retry";button.addEventListener("click",()=>location.reload());status.textContent=error.message||"Please try again."}})();</script></body></html>
